name: Backend CI

on:
  push:
    paths: ['backendserver/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backendserver/**', '.github/workflows/backend-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backendserver

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lumioo_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backendserver/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - name: Type-check
        run: npm run build
      - name: Tests
        run: npm test
